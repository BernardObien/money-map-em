<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Money Map EM Extension — cross-border transfer cost comparison for emerging-market corridors. Route → amount → currency → results.">
<title>Money Map · Transfer cost comparison</title>
<style>
  :root {
    --bg: #F1F0ED;
    --card: #FFFFFF;
    --panel: #FAF9F7;
    --ink: #1A1A18;
    --ink-2: #63625E;
    --ink-3: #9A988F;
    --line: #E7E5DF;
    --line-2: #D8D6CE;
    --red: #E0341C;
    --red-bg: #FCEBE7;
    --red-border: #F4C4B8;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "SF Mono", Monaco, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: var(--font-sans); color: var(--ink); background: var(--bg);
    font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased;
  }
  .tabnum { font-variant-numeric: tabular-nums; }
  .app { max-width: 1180px; margin: 0 auto; padding: 16px; }

  /* Header */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; background: var(--card);
    border: 0.5px solid var(--line); border-radius: 10px 10px 0 0;
    border-bottom: none; gap: 16px; flex-wrap: wrap;
  }
  .wordmark { font-size: 15px; font-weight: 800; letter-spacing: 0.06em; }
  .navtabs { display: flex; gap: 22px; margin-left: 8px; }
  .navtab {
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
    color: var(--ink-3); text-transform: uppercase; padding: 4px 0;
    border-bottom: 2px solid transparent; cursor: default; white-space: nowrap;
  }
  .navtab.active { color: var(--red); border-bottom-color: var(--red); }
  .navtab.disabled { opacity: 0.6; }
  .navtab.disabled::after { content: " · soon"; font-size: 9px; color: var(--ink-3); letter-spacing: 0; }
  .topbar-meta { font-size: 10.5px; color: var(--ink-3); text-align: right; line-height: 1.5; }

  /* Control bar */
  .controlbar {
    display: grid; grid-template-columns: 1.15fr 1.25fr 1.1fr; gap: 0;
    background: var(--card); border: 0.5px solid var(--line);
  }
  .ctl { padding: 16px 20px; border-right: 0.5px solid var(--line); }
  .ctl:last-child { border-right: none; }
  .ctl-label { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; color: var(--ink-3); text-transform: uppercase; margin-bottom: 8px; }
  .route-row { display: flex; align-items: center; gap: 8px; }
  .route-arrow { color: var(--ink-3); font-size: 14px; }
  select.pick, input.amount {
    font-family: inherit; font-size: 14px; color: var(--ink);
    background: var(--card); border: 0.5px solid var(--line-2);
    border-radius: 6px; padding: 8px 10px;
  }
  select.pick { flex: 1; min-width: 0; cursor: pointer; }
  .amount-wrap { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .amount-field { display: flex; align-items: center; border: 0.5px solid var(--line-2); border-radius: 6px; padding: 0 10px; background: var(--card); }
  .amount-field .cur { color: var(--ink-3); font-size: 14px; }
  input.amount { border: none; padding: 8px 4px; width: 96px; font-weight: 600; font-variant-numeric: tabular-nums; }
  input.amount:focus, select.pick:focus { outline: 1.5px solid var(--red); outline-offset: 0; }
  .presets { display: flex; gap: 4px; }
  .preset {
    font-family: inherit; font-size: 12px; color: var(--ink-2);
    background: var(--card); border: 0.5px solid var(--line-2);
    border-radius: 4px; padding: 5px 9px; cursor: pointer;
  }
  .preset:hover { border-color: var(--ink-3); }
  .preset.active { background: var(--red); border-color: var(--red); color: #fff; font-weight: 600; }
  .toggle-cols { display: flex; gap: 24px; }
  .toggle-group { }
  .seg { display: inline-flex; border: 0.5px solid var(--line-2); border-radius: 6px; overflow: hidden; }
  .seg button {
    font-family: inherit; font-size: 12px; font-weight: 600; color: var(--ink-2);
    background: var(--card); border: none; padding: 7px 12px; cursor: pointer;
  }
  .seg button + button { border-left: 0.5px solid var(--line-2); }
  .seg button.on { background: var(--red); color: #fff; }
  .route-map-link { display: inline-block; margin-top: 10px; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: var(--red); text-transform: uppercase; opacity: 0.75; cursor: default; }

  /* Result hero */
  .hero {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; background: var(--card);
    border: 0.5px solid var(--line); border-top: none; padding: 18px 20px;
  }
  .hero-main { font-size: 15px; color: var(--ink-2); }
  .hero-main .send, .hero-main .receive { font-size: 24px; font-weight: 800; color: var(--ink); letter-spacing: -0.01em; }
  .hero-main .arrow { color: var(--ink-3); margin: 0 10px; }
  .hero-sub { font-size: 11.5px; color: var(--ink-3); text-align: right; line-height: 1.5; }
  .infodot {
    display: inline-flex; align-items: center; justify-content: center;
    width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--ink-3);
    color: var(--ink-3); font-size: 9px; font-weight: 700; margin-left: 5px;
    cursor: help; position: relative;
  }
  .infodot:hover .tip { display: block; }
  .tip {
    display: none; position: absolute; right: 0; top: 20px; z-index: 20;
    width: 260px; background: var(--ink); color: #fff; font-weight: 400;
    font-size: 11px; line-height: 1.5; padding: 9px 11px; border-radius: 6px;
    text-align: left; letter-spacing: 0;
  }

  /* Filter bar */
  .filterbar {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    background: var(--panel); border: 0.5px solid var(--line); border-top: none;
    padding: 10px 20px;
  }
  .fgroup { display: flex; align-items: center; gap: 7px; }
  .fgroup-label { font-size: 10px; font-weight: 700; letter-spacing: 0.07em; color: var(--ink-3); text-transform: uppercase; }
  .chip {
    font-family: inherit; font-size: 12px; color: var(--ink-2);
    background: var(--card); border: 0.5px solid var(--line-2);
    border-radius: 5px; padding: 5px 10px; cursor: pointer; white-space: nowrap;
  }
  .chip:hover { border-color: var(--ink-3); }
  .chip.on { background: var(--red); border-color: var(--red); color: #fff; font-weight: 600; }
  select.fpick {
    font-family: inherit; font-size: 12px; color: var(--ink-2);
    background: var(--card); border: 0.5px solid var(--line-2);
    border-radius: 5px; padding: 5px 8px; cursor: pointer;
  }
  select.fpick.on { border-color: var(--red); color: var(--red); font-weight: 600; }
  .filterbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .viewtoggle { display: inline-flex; border: 0.5px solid var(--line-2); border-radius: 6px; overflow: hidden; }
  .viewtoggle button { font-family: inherit; font-size: 12px; font-weight: 600; color: var(--ink-2); background: var(--card); border: none; padding: 6px 12px; cursor: pointer; }
  .viewtoggle button + button { border-left: 0.5px solid var(--line-2); }
  .viewtoggle button.on { background: var(--ink); color: #fff; }
  .clearlink { font-size: 11px; font-weight: 700; letter-spacing: 0.05em; color: var(--ink-3); text-transform: uppercase; background: none; border: none; cursor: pointer; }
  .filtercount { font-size: 11px; font-weight: 700; letter-spacing: 0.05em; color: var(--red); text-transform: uppercase; }

  /* Results meta */
  .results-meta {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; background: var(--card);
    border: 0.5px solid var(--line); border-top: none; padding: 14px 20px 6px;
  }
  .results-count { font-size: 15px; font-weight: 700; }
  .results-count .hidden-n { color: var(--red); }
  .results-note { font-size: 11px; color: var(--ink-3); text-align: right; }

  /* List view */
  .listwrap { background: var(--card); border: 0.5px solid var(--line); border-top: none; border-radius: 0 0 10px 10px; padding: 0 8px 8px; }
  .list-head, .row {
    display: grid;
    grid-template-columns: 34px minmax(0,1fr) 110px 92px 118px 150px 20px;
    gap: 10px; align-items: center;
  }
  .list-head { padding: 8px 12px; border-bottom: 0.5px solid var(--line); }
  .list-head span { font-size: 10px; font-weight: 700; letter-spacing: 0.06em; color: var(--ink-3); text-transform: uppercase; }
  .list-head .r, .row .r { text-align: right; }
  .row {
    padding: 13px 12px; border-bottom: 0.5px solid var(--line); cursor: pointer;
  }
  .row:last-child { border-bottom: none; }
  .row:hover { background: var(--panel); }
  .row-num { color: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; }
  .row-method { min-width: 0; }
  .m-name { font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .m-sub { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }
  .m-total { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  .m-incl { display: block; font-size: 10px; color: var(--ink-3); font-weight: 400; }
  .m-vs { text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .m-speed { text-align: right; font-size: 12.5px; }
  .m-speed .detail { display: block; font-size: 10.5px; color: var(--ink-3); }
  .m-receive { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  .caret { text-align: right; color: var(--ink-3); font-size: 11px; }

  .pill-cheapest { background: var(--red); color: #fff; font-size: 9px; font-weight: 800; letter-spacing: 0.06em; padding: 2px 6px; border-radius: 3px; text-transform: uppercase; }
  .tag-missing { background: var(--panel); color: var(--ink-3); font-size: 9px; font-weight: 700; letter-spacing: 0.04em; padding: 2px 6px; border-radius: 3px; text-transform: uppercase; border: 0.5px solid var(--line-2); }

  /* Expanded breakdown */
  .breakdown {
    grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr 1fr;
    gap: 0; margin: 8px 0 4px; background: var(--panel);
    border: 0.5px solid var(--line); border-radius: 6px; overflow: hidden;
  }
  .bd-col { padding: 14px 16px; border-right: 0.5px solid var(--line); }
  .bd-col:last-child { border-right: none; }
  .bd-title { font-size: 10px; font-weight: 700; letter-spacing: 0.07em; color: var(--ink-3); text-transform: uppercase; margin-bottom: 10px; }
  .bd-line { display: flex; justify-content: space-between; font-size: 12.5px; padding: 3px 0; color: var(--ink-2); }
  .bd-line .v { font-variant-numeric: tabular-nums; color: var(--ink); }
  .bd-line.total { border-top: 0.5px solid var(--line-2); margin-top: 5px; padding-top: 7px; font-weight: 700; color: var(--ink); }
  .bd-rate { font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .bd-meta { font-size: 11px; color: var(--ink-3); margin-top: 6px; line-height: 1.5; }
  .bd-range { font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; }

  /* Card view */
  .cardgrid { background: var(--card); border: 0.5px solid var(--line); border-top: none; border-radius: 0 0 10px 10px; padding: 16px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; }
  .mcard { padding: 4px 16px; border-right: 0.5px solid var(--line); }
  .mcard:last-child { border-right: none; }
  .mcard-badge { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .badge-type { font-size: 10px; font-weight: 700; letter-spacing: 0.07em; color: var(--ink-3); text-transform: uppercase; }
  .mcard-name { font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .mcard-sub { font-size: 11px; color: var(--ink-3); margin: 3px 0 12px; }
  .mcard-hero-l { font-size: 10px; font-weight: 700; letter-spacing: 0.06em; color: var(--ink-3); text-transform: uppercase; padding-top: 12px; border-top: 0.5px solid var(--line); }
  .mcard-hero { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; margin: 2px 0 12px; }
  .mcard-line { display: flex; justify-content: space-between; font-size: 12px; padding: 4px 0; color: var(--ink-2); }
  .mcard-line .v { font-variant-numeric: tabular-nums; color: var(--ink); }
  .mcard-full { display: block; margin-top: 12px; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: var(--red); text-transform: uppercase; background: none; border: none; padding: 0; cursor: pointer; }

  .empty { padding: 40px 20px; text-align: center; color: var(--ink-3); font-size: 13px; }

  footer { padding: 14px 4px 24px; font-size: 11px; color: var(--ink-3); line-height: 1.6; }
  footer a { color: var(--red); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  /* Nav interactivity */
  .navtab[data-tab] { cursor: pointer; }
  .navtab[data-tab]:hover { color: var(--ink); }

  /* vs DCI comparison view */
  .dci { background: var(--card); border: 0.5px solid var(--line); border-radius: 10px; padding: 24px; }
  .dci h2 { font-size: 19px; font-weight: 800; margin: 0 0 4px; }
  .dci .lede { font-size: 13px; color: var(--ink-2); margin: 0 0 8px; max-width: 780px; line-height: 1.6; }
  .dci .lede a { color: var(--red); text-decoration: none; }
  .dci-sec { margin-top: 28px; }
  .dci-sec-h { font-size: 11px; font-weight: 700; letter-spacing: 0.07em; color: var(--ink-3); text-transform: uppercase; margin-bottom: 12px; }
  .cov { width: 100%; border-collapse: collapse; font-size: 13px; }
  .cov th { text-align: left; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; color: var(--ink-3); text-transform: uppercase; padding: 8px 10px; border-bottom: 0.5px solid var(--line); }
  .cov th.c, .cov td.c { text-align: center; }
  .cov td { padding: 10px; border-bottom: 0.5px solid var(--line); vertical-align: middle; }
  .cov .yes { color: var(--red); font-weight: 800; }
  .cov .no { color: var(--ink-3); }
  .cov .note { color: var(--ink-2); font-size: 12px; }
  .cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 0.5px solid var(--line); border-radius: 8px; overflow: hidden; }
  .cmp-col { padding: 16px 18px; }
  .cmp-col:first-child { border-right: 0.5px solid var(--line); background: var(--panel); }
  .cmp-h { font-size: 13px; font-weight: 800; margin-bottom: 2px; }
  .cmp-sub { font-size: 11px; color: var(--ink-3); margin-bottom: 12px; }
  .cmp-item { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 12.5px; padding: 7px 0; border-bottom: 0.5px solid var(--line); }
  .cmp-item:last-child { border-bottom: none; }
  .cmp-item .nm { font-weight: 600; }
  .cmp-item .cat { color: var(--ink-3); font-size: 11px; display: block; font-weight: 400; }
  .cmp-item .val { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
  .flags { list-style: none; padding: 0; margin: 0; }
  .flags li { position: relative; padding: 9px 0 9px 24px; font-size: 13px; color: var(--ink-2); line-height: 1.55; border-bottom: 0.5px solid var(--line); }
  .flags li:last-child { border-bottom: none; }
  .flags li::before { content: "!"; position: absolute; left: 0; top: 9px; width: 15px; height: 15px; border-radius: 50%; background: var(--red-bg); color: var(--red); font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; }

  /* Cost spectrum */
  .spectrum { background: var(--card); border: 0.5px solid var(--line); border-top: none; padding: 14px 20px 10px; }
  .spectrum:empty { display: none; }
  .spectrum-head { font-size: 12px; font-weight: 700; color: var(--ink); display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .spectrum-sub { font-size: 11px; font-weight: 400; color: var(--ink-3); }
  .spectrum-svg { width: 100%; height: 92px; display: block; margin-top: 2px; overflow: visible; }
  .spec-lbl { font: 700 15px var(--font-sans); fill: var(--ink); }
  .spec-lbl-pct { font: 700 13px var(--font-mono); fill: var(--ink-2); }
  .spec-axis { font: 700 12px var(--font-sans); fill: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase; }
  .spectrum-legend { display: flex; gap: 18px; font-size: 11px; color: var(--ink-2); margin-top: 2px; }
  .spectrum-legend .sw { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  .sw-red { background: var(--red); } .sw-ink { background: var(--ink-3); opacity: 0.55; }

  /* study band + why panel + cost table */
  .study-band { background: var(--ink); color: #fff; border-radius: 8px; padding: 16px 18px; margin-bottom: 22px; }
  .study-title { font-size: 13px; font-weight: 800; letter-spacing: 0.02em; }
  .study-thesis { font-size: 13px; color: #d9d8d3; margin-top: 6px; line-height: 1.55; }
  .study-meta { font-size: 11px; color: #9a988f; margin-top: 8px; }
  .why-wrap { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .why-item { font-size: 12.5px; color: var(--ink-2); line-height: 1.5; border: 0.5px solid var(--line); border-left: 3px solid var(--red); border-radius: 6px; padding: 10px 12px; }
  .why-c { display: block; font-weight: 800; color: var(--ink); font-size: 12px; margin-bottom: 4px; }
  .dci-sec-sub { font-size: 12px; color: var(--ink-2); margin: -4px 0 12px; max-width: 780px; line-height: 1.5; }
  .cov .r { text-align: right; }
  .cov.cost td.r { font-variant-numeric: tabular-nums; }
  .cov .muted { color: var(--ink-3); font-size: 11px; font-weight: 400; }
  .cov .delta { color: var(--red); font-weight: 700; font-size: 11px; white-space: nowrap; }
  .cov.gas .gas-barcell { width: 26%; }
  .gas-bar { display: inline-block; height: 8px; background: var(--red); border-radius: 2px; vertical-align: middle; opacity: 0.85; min-width: 2px; }
  .chain-name { font-weight: 700; }
  .gas-usd { font-variant-numeric: tabular-nums; font-weight: 700; }
  .watch { list-style: none; padding: 0; margin: 0; }
  .watch li { font-size: 13px; color: var(--ink-2); line-height: 1.55; padding: 10px 0; border-bottom: 0.5px solid var(--line); }
  .watch li:last-child { border-bottom: none; }
  .w-date { font-variant-numeric: tabular-nums; font-size: 11px; font-weight: 700; color: var(--ink-3); margin-right: 8px; }
  .w-label { display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: var(--red); background: var(--red-bg); border-radius: 3px; padding: 1px 6px; margin-right: 8px; }
  .study-foot { font-size: 12px; color: var(--ink-3); font-style: italic; margin-top: 22px; padding-top: 14px; border-top: 0.5px solid var(--line); line-height: 1.55; }

  @media (max-width: 900px) {
    .controlbar { grid-template-columns: 1fr; }
    .cmp { grid-template-columns: 1fr; }
    .why-wrap { grid-template-columns: 1fr; }
    .cmp-col:first-child { border-right: none; border-bottom: 0.5px solid var(--line); }
    .ctl { border-right: none; border-bottom: 0.5px solid var(--line); }
    .cardgrid { grid-template-columns: repeat(2, 1fr); }
    .mcard { border-bottom: 0.5px solid var(--line); padding-bottom: 12px; }
    .breakdown { grid-template-columns: 1fr; }
    .bd-col { border-right: none; border-bottom: 0.5px solid var(--line); }
  }
  @media (max-width: 640px) {
    .list-head, .row { grid-template-columns: 26px minmax(0,1fr) 84px 108px 16px; }
    .list-head .c-vs, .row .c-vs, .list-head .c-speed, .row .m-speed { display: none; }
    .cardgrid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div style="display:flex; align-items:center; flex-wrap:wrap; gap:8px;">
      <span class="wordmark">MONEY MAP</span>
      <nav class="navtabs">
        <span class="navtab active" data-tab="corridors">Corridors</span>
        <span class="navtab" data-tab="dci">vs DCI</span>
        <span class="navtab" data-tab="gas">Gas fees</span>
        <span class="navtab disabled">Stablecoin use</span>
      </nav>
    </div>
    <div class="topbar-meta" id="topbar-meta"></div>
  </div>

  <div id="corridors-view">
  <div class="controlbar">
    <div class="ctl">
      <div class="ctl-label">Route</div>
      <div class="route-row">
        <select class="pick" id="sender-pick"></select>
        <span class="route-arrow">→</span>
        <select class="pick" id="recipient-pick"></select>
      </div>
      <span class="route-map-link" title="Coming soon">+ Show route map</span>
    </div>
    <div class="ctl">
      <div class="ctl-label">Amount to send</div>
      <div class="amount-wrap">
        <div class="amount-field">
          <span class="cur" id="amount-cur">$</span>
          <input class="amount" id="amount-input" type="text" inputmode="decimal" value="100.00">
        </div>
        <div class="presets" id="presets"></div>
      </div>
    </div>
    <div class="ctl">
      <div class="toggle-cols">
        <div class="toggle-group">
          <div class="ctl-label">Send as</div>
          <div class="seg" id="sendas-seg"></div>
        </div>
        <div class="toggle-group">
          <div class="ctl-label">Receive as</div>
          <div class="seg" id="receiveas-seg"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="hero">
    <div class="hero-main" id="hero-main"></div>
    <div class="hero-sub" id="hero-sub"></div>
  </div>

  <div id="spectrum" class="spectrum"></div>

  <div class="filterbar">
    <div class="fgroup">
      <span class="fgroup-label">Speed</span>
      <div id="speed-chips" style="display:flex; gap:6px;"></div>
    </div>
    <div class="fgroup">
      <span class="fgroup-label">Send</span>
      <select class="fpick" id="send-filter"></select>
    </div>
    <div class="fgroup">
      <span class="fgroup-label">Receive</span>
      <select class="fpick" id="receive-filter"></select>
    </div>
    <div class="filterbar-right">
      <span class="filtercount" id="filter-count"></span>
      <button class="clearlink" id="clear-filters">Clear all</button>
      <div class="viewtoggle" id="view-toggle"></div>
      <div class="fgroup">
        <span class="fgroup-label">Sort</span>
        <select class="fpick" id="sort-pick">
          <option value="cheapest">Cheapest</option>
          <option value="fastest">Fastest</option>
        </select>
      </div>
    </div>
  </div>

  <div class="results-meta">
    <div class="results-count" id="results-count"></div>
    <div class="results-note" id="results-note"></div>
  </div>

  <div id="results"></div>
  </div><!-- /corridors-view -->

  <div id="dci-view" style="display:none;"></div>

  <div id="gas-view" style="display:none;"></div>

  <footer id="footer"></footer>
</div>

<script src="app.js"></script>
</body>
</html>
